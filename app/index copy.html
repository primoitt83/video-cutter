<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editor de Vídeo Online</title>
    <style>
        #progressBar {
            width: 100%;
            height: 10px;
            background-color: #ddd;
        }
        #progressBar div {
            height: 100%;
            background-color: #4caf50;
            width: 0;
        }
    </style>
</head>
<body>
    <h1>Editor de Vídeo Online</h1>
    <form id="uploadForm" enctype="multipart/form-data">
        <input type="file" id="videoInput" name="video" accept="video/*" required />
        <button type="submit">Enviar Vídeo</button>
    </form>

    <div id="progressBar"><div></div></div>

    <video id="videoPlayer" controls width="640" style="display: none;"></video>

    <div id="cutControls" style="display: none;">
        <button type="button" onclick="setStartTime()">Selecione Início do Corte</button>
        <span id="startTimeLabel">Início: Não selecionado</span>
        <br>
        <button type="button" onclick="setEndTime()">Selecione Fim do Corte</button>
        <span id="endTimeLabel">Fim: Não selecionado</span>
        <br>
        <label>
            <input type="checkbox" id="fastCutCheckbox"> Corte rápido (sem re-encode)
        </label>
        <br>
        <button type="button" onclick="cutVideo()">Cortar Vídeo</button>
    </div>

    <a id="downloadLink" style="display: none;" download>Baixar Vídeo Cortado</a>

    <script>
        let uploadedFilename = '';
        let startTime = 0;
        let endTime = 0;

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData();
            const fileInput = document.getElementById('videoInput');
            formData.append('video', fileInput.files[0]);

            const progressBar = document.querySelector('#progressBar div');
            progressBar.style.width = '0%';

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/upload', true);

            xhr.upload.onprogress = function(event) {
                if (event.lengthComputable) {
                    const percentComplete = (event.loaded / event.total) * 100;
                    progressBar.style.width = percentComplete + '%';
                }
            };

            xhr.onload = function() {
                if (xhr.status === 200) {
                    const data = JSON.parse(xhr.responseText);
                    uploadedFilename = data.filename;

                    const videoPlayer = document.getElementById('videoPlayer');
                    videoPlayer.src = `/uploads/${uploadedFilename}`;
                    videoPlayer.style.display = 'block';

                    document.getElementById('cutControls').style.display = 'block';
                }
            };

            xhr.send(formData);
        });

        function setStartTime() {
            startTime = document.getElementById('videoPlayer').currentTime;
            document.getElementById('startTimeLabel').innerText = `Início: ${startTime.toFixed(2)}s`;
        }

        function setEndTime() {
            endTime = document.getElementById('videoPlayer').currentTime;
            document.getElementById('endTimeLabel').innerText = `Fim: ${endTime.toFixed(2)}s`;
        }

        async function cutVideo() {
            const fastCut = document.getElementById('fastCutCheckbox').checked;

            const response = await fetch('/cut-video', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ startTime, endTime, filename: uploadedFilename, fastCut })
            });

            const data = await response.json();
            const downloadLink = document.getElementById('downloadLink');
            downloadLink.href = data.url;
            downloadLink.style.display = 'block';
            downloadLink.innerText = 'Baixar Vídeo Cortado';
        }
    </script>
</body>
</html>
